packages:
  - apps/*
  - packages/*

autoInstallPeers: true
strictPeerDependencies: false
shellEmulator: true

catalog:
  typescript: 6.0.3
  zod: ^4.6.7
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  '@types/node': ^26.6.5

# Supply-chain delay: pnpm refuses versions published less than a day ago unless listed here.
# pnpm maintains this list itself (`pnpm install` appends what it had to let through).
minimumReleaseAgeExclude:
  - '@mantine/core@9.7.4'
  - '@mantine/dates@9.7.4'
  - '@mantine/dropzone@9.7.4'
  - '@mantine/hooks@9.7.4'
  - '@mantine/modals@9.7.4'
  - '@mantine/notifications@9.7.4'
  - '@mantine/spotlight@9.7.4'
  - '@mantine/store@9.7.4'
  - '@tanstack/query-core@5.105.0'
  - '@tanstack/query-devtools@5.105.0'
  - '@tanstack/react-query-devtools@5.105.0'
  - '@tanstack/react-query@5.105.0'
  - '@typescript-eslint/eslint-plugin@8.72.1'
  - '@typescript-eslint/parser@8.72.1'
  - '@typescript-eslint/project-service@8.72.1'
  - '@typescript-eslint/scope-manager@8.72.1'
  - '@typescript-eslint/tsconfig-utils@8.72.1'
  - '@typescript-eslint/type-utils@8.72.1'
  - '@typescript-eslint/types@8.72.1'
  - '@typescript-eslint/typescript-estree@8.72.1'
  - '@typescript-eslint/utils@8.72.1'
  - '@typescript-eslint/visitor-keys@8.72.1'
  - typescript-eslint@8.72.1

# Dependency lifecycle scripts are blocked unless reviewed here (pnpm ≥ 10).
# true  = the script is needed (prebuilt binary download / validation)
# false = optional native add-on we do not need (pure-JS fallback exists)
allowBuilds:
  esbuild: true
  sharp: true
  '@node-rs/argon2': true
  msw: true
  cpu-features: false
  ssh2: false
  protobufjs: false
