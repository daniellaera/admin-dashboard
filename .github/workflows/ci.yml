# CI — GitHub Actions (primary) and Gitea Actions (secondary, same syntax). ADR-011, D-016.
#
# GitHub-hosted runners only. Jobs that need Docker (e2e, image) run on github.com; a Gitea
# runner still gets check / api-integration / security, and image-gitea when registry secrets exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 26
  PNPM_VERSION: 12.15.0
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:unit
      - run: pnpm build

  api-integration:
    name: API integration tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test

  security:
    name: Dependency audit · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies, high and critical fail the build)
        run: pnpm audit --prod --audit-level=high
      - name: gitleaks (repo rules in .gitleaks.toml)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest
          git --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 /repo

  e2e:
    name: End-to-end (production image + compose)
    runs-on: ubuntu-latest
    needs: [check]
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the image under test
        run: docker build -t devconnector:ci .
      - name: Start the stack (image, PostgreSQL, Mailpit)
        run: docker compose -f compose.yml -f compose.ci.yml up -d --wait
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the Playwright suite against the running image
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MAILPIT_URL: http://localhost:8025
      - name: Application logs
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down -v

  # ── Image: native build per architecture, merged into one manifest (no QEMU) ────────────
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [check, api-integration, security, e2e]
    if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest (sha + main)
    runs-on: ubuntu-latest
    needs: [image]
    if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the per-architecture images into one manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:main" \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"

  # ── Gitea (secondary): single-arch image to the Gitea registry when its secrets exist ──────
  image-gitea:
    name: Image (Gitea registry)
    runs-on: ubuntu-latest
    needs: [check, api-integration, security]
    if: github.server_url != 'https://github.com' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
            ${{ secrets.REGISTRY }}/${{ github.repository }}:main
